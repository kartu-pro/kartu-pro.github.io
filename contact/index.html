<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Primary SEO Meta Tags -->
  <title>Contact | KartuPro</title>
  <meta name="description"
    content="Get in touch with the KartuPro team. Send us your feedback, questions, or suggestions about our Georgian language learning tools.">
  <link rel="canonical" href="https://kartu-pro.github.io/contact/">

  <!-- Open Graph / Social Media -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://kartu-pro.github.io/contact/">
  <meta property="og:title" content="Contact KartuPro">
  <meta property="og:description" content="Have questions or feedback about KartuPro? Reach out to us here.">
  <meta property="og:image" content="https://kartu-pro.github.io/assets/logo.svg">
  <meta property="og:site_name" content="KartuPro">

  <link rel="stylesheet" href="/css/main.css">
  <style>
    .contact-section {
      margin-top: 2rem;
    }

    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      margin-top: 1rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .form-group label {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--color-text-primary);
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 0.75rem 1rem;
      font-family: var(--font-body);
      font-size: 0.95rem;
      color: var(--color-text-primary);
      background-color: var(--color-bg);
      border: 1px solid var(--color-border-dark);
      border-radius: var(--radius-sm);
      transition: var(--transition);
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--color-accent);
      box-shadow: 0 0 0 2px var(--color-bg), 0 0 0 4px var(--color-accent);
    }

    .contact-form button[type="submit"] {
      align-self: flex-start;
      margin-top: 0.5rem;
    }

    .status-msg {
      font-size: 0.95rem;
      font-weight: 600;
      margin-top: 0.5rem;
    }
  </style>
  <script type="module" src="/js/components/SiteHeader.js"></script>
  <script type="module" src="/js/components/SiteFooter.js"></script>
</head>

<body>

  <site-header></site-header>

  <main>
    <section class="card-box contact-section">
      <h2>Contact Us</h2>
      <p>Have questions or feedback? Send us a message.</p>

      <form id="contactForm" class="contact-form">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required placeholder="Your name">
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required placeholder="you@example.com">
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="4" required placeholder="Write your message here..."></textarea>
        </div>

        <button type="submit" class="btn-accent">Send Message</button>
        <p id="status" class="status-msg"></p>
      </form>
    </section>
  </main>

  <site-footer></site-footer>

  <script type="module">
    import {apiPost} from '/js/api.js';

    const form = document.getElementById('contactForm');
    const status = document.getElementById('status');
    const submitBtn = form.querySelector('button[type="submit"]');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const payload = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        message: document.getElementById('message').value
      };

      submitBtn.disabled = true;
      status.style.color = 'var(--color-text-secondary)';
      status.innerText = 'Sending message...';

      try {
        await apiPost('/contact', payload);
        status.style.color = 'var(--color-success)';
        status.innerText = 'Thank you! Your message has been sent.';
        form.reset();
      } catch (err) {
        status.style.color = 'var(--color-accent)';
        status.innerText = err.message || 'Failed to send message. Please try again.';
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>

</body>

</html>
