<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drills | Kartu Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --geo-red: #A70007;
            --geo-dark: #2c3e50;
            --bg: #f8f5f0;
            --card-white: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans Georgian', -apple-system, sans-serif;
            background-color: var(--bg);
            margin: 0;
            color: var(--geo-dark);
            line-height: 1.5;
        }

        /* --- NAVIGATION --- */
        .site-header {
            background: var(--geo-dark);
            color: white;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 4px solid var(--geo-red);
        }

        .nav-container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
        }

        .brand {
            font-weight: bold;
            font-size: 1.2rem;
            text-decoration: none;
            color: white;
        }

        .menu-toggle {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 5px;
        }

        .menu-toggle span {
            display: block;
            width: 25px;
            height: 3px;
            background: white;
            border-radius: 2px;
        }

        .nav-links {
            display: flex;
            gap: 10px;
        }

        .nav-link {
            color: #ecf0f1;
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 6px;
            font-size: 14px;
            transition: 0.2s;
        }

        .nav-link:hover, .nav-link.active {
            background: var(--geo-red);
            color: white;
        }

        @media (max-width: 768px) {
            .menu-toggle { display: flex; }

            .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 60px;
                left: 0;
                width: 100%;
                background: var(--geo-dark);
                padding: 10px 0;
                border-bottom: 4px solid var(--geo-red);
            }

            .nav-links.is-open { display: flex; }
            .nav-link { width: 100%; text-align: center; border-radius: 0; padding: 15px 0; }
        }

        /* --- LAYOUT --- */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .hero {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(to bottom, #2c3e50, #1a252f);
            color: white;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .hero h1 {
            font-size: 2.2rem;
            margin-top: 0;
            margin-bottom: 12px;
        }

        .hero p {
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
            opacity: 0.9;
        }

        .drill-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .drill-card {
            background: var(--card-white);
            border-radius: 10px;
            padding: 20px;
            text-decoration: none;
            color: var(--geo-dark);
            border: 2px solid transparent;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: all 0.2s ease;
        }

        .drill-card:hover {
            border-color: var(--geo-red);
            transform: translateY(-2px);
        }

        .drill-card h3 {
            margin: 0;
            font-size: 1.1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .drill-card h3 span {
            color: var(--geo-red);
        }
    </style>
</head>
<body>

    <header class="site-header">
        <div class="nav-container">
            <a href="/" class="brand">🇬🇪 Kartu Pro</a>

            <button class="menu-toggle" id="mobile-menu-btn" aria-label="Menu">
                <span></span><span></span><span></span>
            </button>

            <nav class="nav-links" id="nav-menu">
                <a href="verbs.html" class="nav-link">Verbs</a>
                <a href="sounds.html" class="nav-link">Sounds</a>
                <a href="nouns.html" class="nav-link">Nouns</a>
                <a href="pronouns.html" class="nav-link">Pronouns</a>
                <a href="adjectives.html" class="nav-link">Adjectives</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <section class="hero">
            <h1>Master Georgian Through Repetition</h1>
            <p>Build instant reflexes for complex grammar rules and pronunciation. Select a drill below to get started.</p>
        </section>

        <main class="drill-grid">
            <a href="verbs.html" class="drill-card">
                <h3>Verbs <span>→</span></h3>
            </a>
            <a href="sounds.html" class="drill-card">
                <h3>Sounds <span>→</span></h3>
            </a>
            <a href="nouns.html" class="drill-card">
                <h3>Nouns <span>→</span></h3>
            </a>
            <a href="pronouns.html" class="drill-card">
                <h3>Pronouns <span>→</span></h3>
            </a>
            <a href="adjectives.html" class="drill-card">
                <h3>Adjectives <span>→</span></h3>
            </a>
        </main>
    </div>

    <script>
        const menuBtn = document.getElementById('mobile-menu-btn');
        const navMenu = document.getElementById('nav-menu');

        menuBtn.addEventListener('click', () => {
            navMenu.classList.toggle('is-open');
        });

        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', () => navMenu.classList.remove('is-open'));
        });
    </script>
    
</body>
</html>
