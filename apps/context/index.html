<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
  <title>KartuContext</title>

  <!-- Global & App Styles -->
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="context.css">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;700&display=swap" rel="stylesheet">

  <!-- External Scripts -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="h-dvh overflow-hidden">
  <div id="app" v-cloak class="app-container flex flex-col flex-1 min-h-0">

    <!-- Compact Sub-App Header -->
    <header class="app-header flex-none">
      <a href="/apps" class="app-back-link">
        <div class="logo-circle-sm">
          <img src="/assets/logo.svg" alt="KartuPro - Georgian Language Learning Logo">
        </div>
        <span>← Apps</span>
      </a>
      <button @click="showSettingsModal = true"
        class="text-sm font-bold bg-[var(--color-surface)] border border-[var(--color-border)] px-3 py-1.5 rounded transition-colors hover:bg-[var(--color-surface-hover)]">
        ⚙️ Settings
      </button>
    </header>

    <settings-modal v-model="gameMode" :show="showSettingsModal" @close="showSettingsModal = false"></settings-modal>

    <main class="w-full max-w-3xl mx-auto flex-1 flex flex-col min-h-0 my-0">

      <!-- LOADING -->
      <div v-if="appState === 'loading'" class="text-center py-12 flex-1 flex items-center justify-center">
        <h2 class="text-2xl font-bold">Loading...</h2>
      </div>

      <!-- SETUP UI -->
      <div v-else-if="appState === 'setup'" class="flex-1 flex flex-col min-h-0">

        <!-- Fixed Header -->
        <div class="flex-none mb-4">
          <span class="badge">Grammar in Context</span>
          <h1 class="text-2xl sm:text-3xl font-extrabold mt-1">What do you want to study?</h1>
        </div>

        <!-- Scrollable Filters Container -->
        <div class="flex-1 overflow-y-auto pr-1 flex flex-col gap-4 min-h-0">

          <pos-select v-model="filters.topic"></pos-select>



          <!-- Grammar Filters -->
          <div v-if="filters.topic" class="card-box">
            <h3 class="font-bold text-sm border-b border-[var(--color-border)] pb-2 mb-3">Grammar Filters</h3>

            <!-- VERBS -->
            <template v-if="filters.topic === 'verb'">
              <chip-multi-select-filter label="Screeve" :items="Object.values(SCREEVE)" v-model="filters.scr"
                :item-map="SCREEVE_LABELS"></chip-multi-select-filter>

              <chip-multi-select-filter label="Subject" :items="Object.values(PERSON_NUM)" v-model="filters.subj"
                :item-map="PERSON_NUM_LABELS"></chip-multi-select-filter>
            </template>

            <!-- CASES -->
            <template v-if="['noun', 'pron', 'adj'].includes(filters.topic)">
              <chip-multi-select-filter label="Case" :items="Object.values(CASE)" v-model="filters.case"
                :item-map="CASE_LABELS"></chip-multi-select-filter>
            </template>

            <!-- QTY -->
            <template v-if="['noun', 'pron'].includes(filters.topic)">
              <chip-multi-select-filter label="Quantity" :items="Object.values(QTY)" v-model="filters.qty"
                :item-map="QTY_LABELS"></chip-multi-select-filter>
            </template>

            <!-- POSTPOSITIONS -->
            <template v-if="['noun'].includes(filters.topic)">
              <chip-multi-select-filter label="Postpositions" :items="Object.values(POSTPOSITION)" v-model="filters.pp"
                :item-map="POSTPOSITION_LABELS"></chip-multi-select-filter>
            </template>

          </div>

          <!-- Vocab Filters -->
          <div v-if="filters.topic" class="card-box">
            <h3 class="font-bold text-sm border-b border-[var(--color-border)] pb-2 mb-3">
              {{ isLoadingDictionary ? 'Loading Vocab Filters...' : 'Word Filters' }}
            </h3>
            <word-filter v-model="wordSearch" :dictionary="dictionary" :topic="filters.topic"
              :selected-words="filters.words" @add-word="addWordToFilters" @remove-word="removeWordFromFilters"
              :disabled="isLoadingDictionary || !filters.topic">
            </word-filter>

            <chip-multi-select-filter label="Tags" :items="availableTags" v-model="filters.tags"
              :disabled="isLoadingDictionary || !filters.topic"></chip-multi-select-filter>
          </div>
        </div>


        <!-- Fixed Bottom Bar -->
        <!-- Validation Errors -->
        <div class="flex-none pt-3 border-t border-[var(--color-border)] mt-2">
          <div v-if="validationErrors.length > 0"
            class="mb-3 p-3 bg-[var(--color-surface)] border-l-4 border-[var(--color-accent)] text-[var(--color-accent)] rounded text-sm font-semibold">
            <ul class="list-disc ml-4">
              <li v-for="err in validationErrors" :key="err">{{ err }}</li>
            </ul>
          </div>

          <button class="btn-primary w-full text-lg" @click="startDrill" :disabled="validationErrors.length > 0">
            Start
          </button>

        </div>

      </div>

      <!-- QUIZ UI -->
      <div v-else-if="appState === 'quiz'" class="flex-1 flex flex-col min-h-0 justify-between">
        <div class="flex justify-between items-center mb-2 flex-none">
          <span class="text-secondary text-sm font-bold">Remaining: {{ activeQueue.length }}</span>
          <button
            class="text-sm font-bold bg-[var(--color-surface)] border border-[var(--color-border)] px-3 py-1 rounded transition-colors hover:bg-[var(--color-surface-hover)]"
            @click="appState = 'setup'">Quit</button>
        </div>

        <div class="card-box flex-1 flex flex-col items-center justify-center text-center my-2" v-if="currentCard">
          <!-- Shared Feedback Header -->
          <div class="min-h-[40px] text-center mb-4 font-bold flex flex-col items-center justify-center">
            <div v-if="feedback.msg"
              :class="{'text-success': feedback.type === 'success', 'text-[var(--color-accent)]': feedback.type === 'error'}">
              {{ feedback.msg }}
            </div>
            <div v-if="feedback.type === 'error' && feedback.diff" class="mt-1">
              <span v-for="(part, i) in feedback.diff" :key="i" :class="'diff-' + part.type" class="diff-char">{{
                part.char }}</span>
            </div>
          </div>

          <!-- Dynamic Game Modes -->
          <quiz-type-form v-if="gameMode === 'type'" ref="typeFormRef" :card="currentCard"
            :is-submitted="isAnswerSubmitted" @submit="handleAnswerSubmitted"
            @next="handlePrimaryAction"></quiz-type-form>

          <quiz-choose-form v-else-if="gameMode === 'choose'" :card="currentCard" :is-submitted="isAnswerSubmitted"
            @submit="handleAnswerSubmitted" @next="handlePrimaryAction"></quiz-choose-form>

          <quiz-find-mistake v-else-if="gameMode === 'mistake'" :card="currentCard" :is-submitted="isAnswerSubmitted"
            @submit="handleAnswerSubmitted"></quiz-find-mistake>
        </div>

        <div class="pt-2 flex-none">
          <button class="btn-primary w-full text-lg" :class="{ 'btn-next-active': isAnswerSubmitted }"
            @click="handlePrimaryAction" :disabled="!isAnswerSubmitted && gameMode !== 'type'">
            {{ isAnswerSubmitted ? 'Next (Enter)' : (gameMode === 'type' ? 'Check Answer (Enter)' : 'Select an Option')
            }}
          </button>
        </div>
      </div>

      <!-- FINISHED UI -->
      <div v-else-if="appState === 'finished'" class="text-center flex-1 flex flex-col items-center justify-center">
        <h2 class="text-3xl font-bold mb-2">Review Complete! 🎉</h2>
        <p class="text-secondary mb-6 font-semibold">Great practice session.</p>

        <div class="flex flex-col sm:flex-row gap-3 w-full max-w-xs">
          <button class="btn-primary flex-1 py-3" @click="startDrill">
            🔄 Load More
          </button>
          <button
            class="bg-[var(--color-surface)] border border-[var(--color-border)] text-[var(--color-text-primary)] font-bold flex-1 py-3 rounded-lg hover:opacity-80 transition"
            @click="appState = 'setup'">
            ⚙️ Setup
          </button>
        </div>
      </div>

    </main>

  </div>

  <script type="module" src="app.js"></script>
</body>

</html>
