<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kartu Pro — Master Georgian</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #f1f5f9;
      --accent: #2563eb;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #090d16;
        --text: #f8fafc;
        --muted: #94a3b8;
        --border: #1e293b;
        --accent: #3b82f6;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 2rem 1.5rem;
    }

    header {
      max-width: 720px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 3rem;
    }

    .logo {
      font-weight: 700;
      font-size: 1.1rem;
      text-decoration: none;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    nav {
      display: flex;
      gap: 1.25rem;
    }

    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: color 0.15s ease;
    }

    nav a:hover {
      color: var(--text);
    }

    main {
      max-width: 720px;
      margin: auto;
      width: 100%;
    }

    .badge {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--accent);
      background: rgba(37, 99, 235, 0.1);
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      margin-bottom: 1.25rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    h1 {
      font-size: clamp(2.2rem, 5vw, 3.2rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin-bottom: 1.25rem;
    }

    p.subtitle {
      font-size: 1.2rem;
      color: var(--muted);
      max-width: 540px;
      margin-bottom: 2.5rem;
    }

    .cta-group {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .btn {
      display: inline-block;
      background: var(--text);
      color: var(--bg);
      padding: 0.8rem 1.6rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: opacity 0.15s ease;
    }

    .btn:hover {
      opacity: 0.9;
    }

    footer {
      max-width: 720px;
      margin: 0 auto;
      width: 100%;
      padding-top: 3rem;
      color: var(--muted);
      font-size: 0.85rem;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <header>
    <a href="/" class="logo">Kartu Pro</a>
    <nav>
      <a href="/drills">Drills</a>
      <a href="/stories">Stories</a>
      <a href="/resources">Resources</a>
      <a href="/tools">Tools</a>
      <a href="/blog">Blog</a>
    </nav>
  </header>

  <main>
    <span class="badge">ქართული ენა</span>
    <h1>Take your Georgian to the next level.</h1>
    <p class="subtitle">
      Move beyond the basics. Master complex verb structures, natural comprehension, and real-world phrasing through targeted practice.
    </p>
    <div class="cta-group">
      <a href="/drills" class="btn">Start practicing →</a>
    </div>
  </main>

  <footer>
    &copy; Kartu Pro. Built for dedicated learners.
  </footer>

</body>
</html>
