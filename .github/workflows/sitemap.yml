name: Generate Sitemap

on:
  push:
    branches:
      - main  # or 'master' depending on your default branch name

jobs:
  sitemap_job:
    runs-on: ubuntu-latest
    name: Generate Sitemap
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate SW / XML Sitemap
        uses: cicirello/generate-sitemap@v1
        with:
          base-url-path: https://kartu-pro.github.io/
          drop-html-extension: true

      - name: Commit and Push Sitemap Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update sitemap.xml [skip ci]"
          file_pattern: 'sitemap.xml'
