name: Generate Sitemap

on:
  push:
    branches:
      - main  # Change to 'master' if your default branch is master

jobs:
  sitemap_job:
    runs-on: ubuntu-latest
    name: Generate Sitemap
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate Sitemap XML
        run: |
          python -c "
          import os
          from datetime import datetime, timezone

          SITE_URL = 'https://kartu-pro.github.io'
          urls = []

          for root, dirs, files in os.walk('.'):
              if '/.' in root or root.startswith('./.'):
                  continue
              
              for file in files:
                  if file.startswith('google') or not file.endswith('.html'):
                      continue

                  full_path = os.path.join(root, file)
                  clean_path = os.path.normpath(full_path)
                  
                  if clean_path == 'index.html':
                      url_path = ''
                  elif clean_path.endswith('index.html'):
                      url_path = clean_path[:-10]
                  else:
                      url_path = clean_path[:-5]

                  if url_path and not url_path.startswith('/'):
                      url_path = '/' + url_path
                  
                  full_url = f'{SITE_URL}{url_path}'

                  # Ensure root home URL and directory paths end with /
                  if not full_url.endswith('/') and not '.' in os.path.basename(full_url):
                      full_url += '/'

                  # Handle edge case where root URL comes out as 'https://kartu-pro.github.io'
                  if full_url == SITE_URL:
                      full_url = SITE_URL + '/'

                  mtime = os.path.getmtime(full_path)
                  lastmod = datetime.fromtimestamp(mtime, tz=timezone.utc).strftime('%Y-%m-%d')

                  urls.append((full_url, lastmod))

          xml = ['<?xml version=\"1.0\" encoding=\"UTF-8\"?>']
          xml.append('<urlset xmlns=\"http://www.sitemaps.org/schemas/sitemap/0.9\">')
          
          for url, lastmod in sorted(set(urls)):
              priority = '1.0' if url == SITE_URL + '/' else '0.8'
              xml.append('  <url>')
              xml.append(f'    <loc>{url}</loc>')
              xml.append(f'    <lastmod>{lastmod}</lastmod>')
              xml.append('    <changefreq>weekly</changefreq>')
              xml.append(f'    <priority>{priority}</priority>')
              xml.append('  </url>')
              
          xml.append('</urlset>')

          with open('sitemap.xml', 'w', encoding='utf-8') as f:
              f.write('\n'.join(xml))
          "

      - name: Commit and Push Sitemap
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update sitemap.xml [skip ci]"
            git push
          else
            echo "No changes in sitemap.xml to commit."
          fi
