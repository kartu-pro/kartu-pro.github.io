<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Translit | KartuPro</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    /* Tool Input & Tables */
    .tool-box {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      margin-bottom: 2.5rem;
    }

    .transliterate-input {
      width: 100%;
      padding: 0.85rem 1rem;
      font-family: var(--font-body);
      font-size: 1.05rem;
      color: var(--color-text-primary);
      background-color: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      resize: vertical;
    }

    .transliterate-input:focus {
      outline: 2px solid var(--color-accent);
      outline-offset: 0;
    }

    .reference-section {
      margin-top: 2rem;
    }

    .translit-table {
      width: 100%;
      border-collapse: collapse;
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-top: 1rem;
    }

    .translit-table th,
    .translit-table td {
      padding: 0.75rem 1rem;
      text-align: center;
      border-bottom: 1px solid var(--color-border);
    }

    .translit-table th {
      background-color: var(--color-surface-hover);
      font-family: var(--font-heading);
      font-weight: 700;
      color: var(--color-text-primary);
    }

    .translit-table tr:last-child td {
      border-bottom: none;
    }
  </style>
</head>

<body>

  <header>
    <a href="/" class="brand-link">
      <div class="logo-circle">
        <img src="/assets/logo.svg" alt="Kartu Pro Logo">
      </div>
      <span class="brand-title">KartuPro</span>
    </a>

    <nav class="nav-links">
      <a href="/apps/">Apps</a>
      <a href="/resources/">Resources</a>
      <a href="/about/">About</a>
    </nav>
  </header>

  <main>
    <h1>KartuTranslit</h1>
    <p class="subtitle">Convert back and forth between Georgian and Latin letters.</p>

    <div class="card-box tool-box">
      <textarea id="inputText" class="transliterate-input" rows="4" placeholder="Paste or type text here..."></textarea>

      <div class="cta-group">
        <button type="button" class="btn-accent" onclick="toLatin()">To Latin</button>
        <button type="button" class="btn-primary" onclick="toGeorgian()">To Georgian</button>
        <button type="button" class="btn-secondary" onclick="copyText()">Copy Text</button>
        <button type="button" class="btn-secondary" onclick="clearText()">Clear</button>
      </div>
    </div>

    <section class="reference-section">
      <h2>Alphabet Reference</h2>
      <table class="translit-table">
        <thead>
          <tr>
            <th>Georgian</th>
            <th>Latin</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>ა</td>
            <td>a</td>
          </tr>
          <tr>
            <td>ბ</td>
            <td>b</td>
          </tr>
          <tr>
            <td>გ</td>
            <td>g</td>
          </tr>
          <tr>
            <td>დ</td>
            <td>d</td>
          </tr>
          <tr>
            <td>ე</td>
            <td>e</td>
          </tr>
          <tr>
            <td>ვ</td>
            <td>v</td>
          </tr>
          <tr>
            <td>ზ</td>
            <td>z</td>
          </tr>
          <tr>
            <td>თ</td>
            <td>t</td>
          </tr>
          <tr>
            <td>ი</td>
            <td>i</td>
          </tr>
          <tr>
            <td>კ</td>
            <td>k’</td>
          </tr>
          <tr>
            <td>ლ</td>
            <td>l</td>
          </tr>
          <tr>
            <td>მ</td>
            <td>m</td>
          </tr>
          <tr>
            <td>ნ</td>
            <td>n</td>
          </tr>
          <tr>
            <td>ო</td>
            <td>o</td>
          </tr>
          <tr>
            <td>პ</td>
            <td>p’</td>
          </tr>
          <tr>
            <td>ჟ</td>
            <td>zh</td>
          </tr>
          <tr>
            <td>რ</td>
            <td>r</td>
          </tr>
          <tr>
            <td>ს</td>
            <td>s</td>
          </tr>
          <tr>
            <td>ტ</td>
            <td>t’</td>
          </tr>
          <tr>
            <td>უ</td>
            <td>u</td>
          </tr>
          <tr>
            <td>ფ</td>
            <td>p</td>
          </tr>
          <tr>
            <td>ქ</td>
            <td>k</td>
          </tr>
          <tr>
            <td>ღ</td>
            <td>gh</td>
          </tr>
          <tr>
            <td>ყ</td>
            <td>q’</td>
          </tr>
          <tr>
            <td>შ</td>
            <td>sh</td>
          </tr>
          <tr>
            <td>ჩ</td>
            <td>ch</td>
          </tr>
          <tr>
            <td>ც</td>
            <td>ts</td>
          </tr>
          <tr>
            <td>ძ</td>
            <td>dz</td>
          </tr>
          <tr>
            <td>წ</td>
            <td>ts’</td>
          </tr>
          <tr>
            <td>ჭ</td>
            <td>ch’</td>
          </tr>
          <tr>
            <td>ხ</td>
            <td>kh</td>
          </tr>
          <tr>
            <td>ჯ</td>
            <td>j</td>
          </tr>
          <tr>
            <td>ჰ</td>
            <td>h</td>
          </tr>
        </tbody>
      </table>
    </section>

    <script>
      const georgianToLatinMap = {
        "ა": "a", "ბ": "b", "გ": "g", "დ": "d", "ე": "e", "ვ": "v", "ზ": "z",
        "თ": "t", "ი": "i", "კ": "k’", "ლ": "l", "მ": "m", "ნ": "n", "ო": "o",
        "პ": "p’", "ჟ": "zh", "რ": "r", "ს": "s", "ტ": "t’", "უ": "u", "ფ": "p",
        "ქ": "k", "ღ": "gh", "ყ": "q’", "შ": "sh", "ჩ": "ch", "ც": "ts", "ძ": "dz",
        "წ": "ts’", "ჭ": "ch’", "ხ": "kh", "ჯ": "j", "ჰ": "h"
      };

      const latinToGeorgianMap = Object.fromEntries(
        Object.entries(georgianToLatinMap).map(([ge, la]) => [la, ge])
      );

      function toLatin() {
        const text = document.getElementById('inputText').value;
        document.getElementById('inputText').value = text.split('').map(char => georgianToLatinMap[char] || char).join('');
      }

      function toGeorgian() {
        let text = document.getElementById('inputText').value;
        const keys = Object.keys(latinToGeorgianMap).sort((a, b) => b.length - a.length);

        keys.forEach(latin => {
          const pattern = latin.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/['’]/g, "['’]");
          const regex = new RegExp(pattern, 'gi');
          text = text.replace(regex, latinToGeorgianMap[latin]);
        });

        document.getElementById('inputText').value = text;
      }

      function clearText() {
        document.getElementById('inputText').value = '';
        document.getElementById('inputText').focus();
      }

      async function copyText() {
        const inputText = document.getElementById('inputText');
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(inputText.value);
        } else {
          inputText.select();
          document.execCommand('copy');
        }
      }
    </script>
  </main>

  <footer>
    &copy; KartuPro.
  </footer>

</body>

</html>
